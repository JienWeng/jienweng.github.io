<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Web3 payment transaction flow</title>
  <desc id="diagram-desc">A stepped flow from payment intent through validation, wallet signing, blockchain monitoring, confirmation, reconciliation, and notification, with a failure branch from monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9" fill="none" stroke="#6f2d1d" stroke-width="1.3"/>
    </marker>
    <style>
      .ink { fill: #302e2a; }
      .soft { fill: #716e67; }
      .accent { fill: #6f2d1d; }
      .line { fill: none; stroke: #6f2d1d; stroke-width: 2; marker-end: url(#arrow); }
      .failure-line { fill: none; stroke: #b7afa5; stroke-width: 1.5; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .node { fill: #f7f6f2; stroke: #302e2a; stroke-width: 1.5; }
      .final { fill: #6f2d1d; stroke: #6f2d1d; stroke-width: 1.5; }
      .failed { fill: #f7f6f2; stroke: #b7afa5; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .heading { font: 21px "Computer Modern Serif", Georgia, serif; }
      .body { font: 12px "Helvetica Neue", Arial, sans-serif; letter-spacing: .04em; }
      .number { font: 11px "Helvetica Neue", Arial, sans-serif; letter-spacing: .13em; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f7f6f2"/>

  <path d="M258 150 H288" class="line"/>
  <path d="M558 150 H588" class="line"/>
  <path d="M744 208 V280 H786 V312" class="line"/>
  <path d="M676 370 H656" class="line"/>
  <path d="M456 370 H436" class="line"/>
  <path d="M236 370 H216" class="line"/>

  <rect x="42" y="104" width="204" height="92" rx="4" class="node"/>
  <text x="66" y="130" class="number soft">01  REQUEST</text>
  <text x="66" y="160" class="heading ink">Payment intent</text>
  <text x="66" y="180" class="body soft">amount · token · network</text>

  <rect x="342" y="104" width="204" height="92" rx="4" class="node"/>
  <text x="366" y="130" class="number soft">02  VALIDATE</text>
  <text x="366" y="160" class="heading ink">Check the details</text>
  <text x="366" y="180" class="body soft">recipient · expiry · chain</text>

  <rect x="642" y="104" width="204" height="92" rx="4" class="node"/>
  <text x="666" y="130" class="number soft">03  WALLET</text>
  <text x="666" y="160" class="heading ink">Review and sign</text>
  <text x="666" y="180" class="body soft">user approval · broadcast</text>

  <rect x="684" y="324" width="184" height="92" rx="4" class="node"/>
  <text x="708" y="350" class="number soft">04  MONITOR</text>
  <text x="708" y="380" class="heading ink">Watch the chain</text>
  <text x="708" y="400" class="body soft">tx hash · pending · processing</text>

  <rect x="464" y="324" width="184" height="92" rx="4" class="node"/>
  <text x="488" y="350" class="number soft">05  CONFIRM</text>
  <text x="488" y="380" class="heading ink">Wait for finality</text>
  <text x="488" y="400" class="body soft">required confirmation</text>

  <rect x="244" y="324" width="184" height="92" rx="4" class="node"/>
  <text x="268" y="350" class="number soft">06  RECONCILE</text>
  <text x="268" y="380" class="heading ink">Match the payment</text>
  <text x="268" y="400" class="body soft">amount · token · recipient</text>

  <rect x="24" y="324" width="184" height="92" rx="4" class="final"/>
  <text x="48" y="350" class="number" fill="#f7f6f2">07  SETTLE</text>
  <text x="48" y="380" class="heading" fill="#f7f6f2">Notify</text>
  <text x="48" y="400" class="body" fill="#eaded7">verified webhook</text>

  <path d="M744 196 C900 220 1012 260 1050 324" class="failure-line"/>
  <rect x="930" y="324" width="240" height="92" rx="4" class="failed"/>
  <text x="954" y="350" class="number soft">EXCEPTION</text>
  <text x="954" y="380" class="heading ink">Failed or delayed</text>
  <text x="954" y="400" class="body soft">retry · review · notify</text>
</svg>
