<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Paired-trade calculation</title>
<desc id="desc">Before fees: 100 YES shares at 0.46 and 100 NO shares at 0.51 cost 97 dollars. The 100 complete pairs pay 100 dollars, leaving 3 dollars.</desc>
<rect width="760" height="360" fill="#f6f3ec"/>
<g font-family="Arial, sans-serif" fill="#35342f" text-anchor="middle">
<g stroke="#875b43" fill="none" stroke-width="2"><rect x="32" y="24" width="330" height="100"/><rect x="398" y="24" width="330" height="100"/><path d="M197 124v34h366v-34M380 158v32"/><path d="m374 182 6 8 6-8"/></g>
<text x="197" y="59" font-size="20" fill="#875b43">YES</text><text x="197" y="96" font-size="26">100 × 0.46 = 46</text>
<text x="563" y="59" font-size="20" fill="#875b43">NO</text><text x="563" y="96" font-size="26">100 × 0.51 = 51</text>
<text x="380" y="226" font-size="28">100 (YES + NO)</text>
<text x="380" y="282" font-size="28">100 − (46 + 51)</text>
<text x="380" y="336" font-size="34" font-weight="600" fill="#875b43">= 3</text>
</g></svg>
