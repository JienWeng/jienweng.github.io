<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">A paired trade, fees, and an incomplete hedge</title>
<desc id="desc">100 YES shares at 0.46 and 100 NO shares at 0.51 cost 97 dollars. Before fees, 100 pairs pay 100 dollars, leaving 3 dollars. With hypothetical share fees, 98.92 pairs leave 1.92 dollars. Separately, filling 100 YES and only 30 NO leaves 30 pairs and 70 unpaired YES shares.</desc>
<rect width="760" height="680" fill="#f6f3ec"/>
<g font-family="Arial, sans-serif" fill="#35342f">
<text x="32" y="42" font-size="23" font-weight="600">One trade, two outcome balances</text>
<text x="32" y="70" font-size="16" fill="#5f5c54">Hypothetical prices · same binary condition · amounts in USD</text>
<g stroke="#875b43" fill="none" stroke-width="2"><rect x="32" y="96" width="330" height="100"/><rect x="398" y="96" width="330" height="100"/><path d="M197 196v30h366v-30M380 226v25"/></g>
<text x="50" y="126" font-size="17" fill="#875b43">YES</text><text x="50" y="157" font-size="23">100 × 0.46 = 46.00</text>
<text x="416" y="126" font-size="17" fill="#875b43">NO</text><text x="416" y="157" font-size="23">100 × 0.51 = 51.00</text>
<text x="380" y="277" text-anchor="middle" font-size="23" font-weight="600">97.00 total purchase cost</text>
<path d="M32 301H728" stroke="#ddd7cc"/>
<text x="32" y="333" font-size="17" fill="#875b43">BOTH LEGS FILL · BEFORE FEES</text>
<text x="32" y="366" font-size="22">100 pairs → 100.00 payout → 3.00 spread</text>
<text x="32" y="411" font-size="17" fill="#875b43">BOTH LEGS FILL · ILLUSTRATIVE SHARE FEES</text>
<text x="32" y="442" font-size="20">98.92 YES + 99.02 NO → 98.92 complete pairs</text>
<text x="32" y="473" font-size="20">98.92 − 97.00 = 1.92 spread, before other costs</text>
<text x="32" y="499" font-size="16" fill="#5f5c54">0.10 NO remains unpaired and is valued at zero in this bound.</text>
<path d="M32 521H728" stroke="#ddd7cc"/>
<text x="32" y="554" font-size="17" fill="#875b43">SEPARATE SCENARIO · PARTIAL FILLS, NO FEES</text>
<rect x="32" y="576" width="209" height="28" fill="#875b43"/><rect x="241" y="576" width="487" height="28" fill="#eee9df" stroke="#875b43"/>
<text x="32" y="634" font-size="19">30 paired YES + NO</text><text x="340" y="634" font-size="19">70 YES exposed to the outcome</text>
<text x="32" y="661" font-size="16" fill="#5f5c54">100 YES filled; only 30 NO filled. The hedge is incomplete.</text>
</g></svg>
