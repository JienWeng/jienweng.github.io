<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2450" viewBox="0 0 720 2450" role="img" aria-labelledby="title desc">
  <title id="title">Order-to-cash and procure-to-pay, mobile layout</title>
  <desc id="desc">Two finance flows connect to one project. Customer billing runs from milestone claim to sales invoice, payment receipt, Autocount posting and archived documents. Supplier payment runs from purchase order to supplier invoice, approved payment voucher, Autocount posting and archived documents.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1 12 7 1 13" fill="none" stroke="#b83e12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:Archivo,Arial,sans-serif;fill:#20201e}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.title{font-size:38px;font-weight:750}.lane{font-size:24px;font-weight:750;letter-spacing:1.2px;fill:#b83e12}.sub{font-size:24px;fill:#494944}.step{font-size:19px;font-weight:700;letter-spacing:1.5px;fill:#b83e12}.head{font-size:30px;font-weight:750}.copy{font-size:25px;fill:#494944}</style></defs>
  <rect width="720" height="2450" fill="#f6f3ec"/><text x="45" y="58" class="eyebrow">CRM · FINANCE HANDOVERS</text><text x="45" y="111" class="title">Two directions of cash</text><text x="45" y="151" class="sub">One project connects customer revenue and costs.</text>
  <rect x="35" y="185" width="650" height="1020" rx="4" fill="#eee9df" stroke="#a6a49d" stroke-width="2"/><rect x="35" y="1245" width="650" height="1020" rx="4" fill="#eee9df" stroke="#a6a49d" stroke-width="2"/>
  <text x="60" y="230" class="lane">01 · ORDER TO CASH</text><text x="60" y="264" class="sub">Customer money in</text><text x="60" y="1290" class="lane">02 · PROCURE TO PAY</text><text x="60" y="1324" class="sub">Supplier money out</text>
  <g fill="#f6f3ec" stroke="#a6a49d" stroke-width="2"><rect x="60" y="295" width="600" height="135" rx="4"/><rect x="60" y="475" width="600" height="135" rx="4"/><rect x="60" y="655" width="600" height="135" rx="4"/><rect x="60" y="835" width="600" height="135" rx="4"/><rect x="60" y="1015" width="600" height="135" rx="4"/><rect x="60" y="1355" width="600" height="135" rx="4"/><rect x="60" y="1535" width="600" height="135" rx="4"/><rect x="60" y="1715" width="600" height="135" rx="4"/><rect x="60" y="1895" width="600" height="135" rx="4"/><rect x="60" y="2075" width="600" height="135" rx="4"/></g>
  <g fill="none" stroke="#b83e12" stroke-width="3" marker-end="url(#arrow)"><path d="M360 430v34"/><path d="M360 610v34"/><path d="M360 790v34"/><path d="M360 970v34"/><path d="M360 1490v34"/><path d="M360 1670v34"/><path d="M360 1850v34"/><path d="M360 2030v34"/></g>
  <g><text x="88" y="330" class="step">CLAIM</text><text x="88" y="370" class="head">Milestone claim</text><text x="88" y="405" class="copy">Completed phase submitted for billing.</text>
  <text x="88" y="510" class="step">BILLING</text><text x="88" y="550" class="head">Sales invoice</text><text x="88" y="585" class="copy">Numbered invoice issued per milestone.</text>
  <text x="88" y="690" class="step">COLLECTION</text><text x="88" y="730" class="head">Payment receipt</text><text x="88" y="765" class="copy">Receipt matched against the invoice.</text>
  <text x="88" y="870" class="step">ACCOUNTING</text><text x="88" y="910" class="head">Posted to Autocount</text><text x="88" y="945" class="copy">Ledger entry; no re-keying.</text>
  <text x="88" y="1050" class="step">RECORDS</text><text x="88" y="1090" class="head">Documents archived</text><text x="88" y="1125" class="copy">Sales order, invoice and receipt.</text>
  <text x="88" y="1390" class="step">SUPPLIER</text><text x="88" y="1430" class="head">Purchase order</text><text x="88" y="1465" class="copy">Against the sales order and project.</text>
  <text x="88" y="1570" class="step">COST CAPTURE</text><text x="88" y="1610" class="head">Supplier invoice</text><text x="88" y="1645" class="copy">Captured and matched to purchase order.</text>
  <text x="88" y="1750" class="step">PAYMENT</text><text x="88" y="1790" class="head">Payment voucher</text><text x="88" y="1825" class="copy">Approved payment sent through.</text>
  <text x="88" y="1930" class="step">ACCOUNTING</text><text x="88" y="1970" class="head">Posted to Autocount</text><text x="88" y="2005" class="copy">Cost recorded against the project.</text>
  <text x="88" y="2110" class="step">RECORDS</text><text x="88" y="2150" class="head">Documents archived</text><text x="88" y="2185" class="copy">Purchase order, bill and voucher.</text></g>
  <rect x="35" y="2300" width="650" height="100" rx="4" fill="#eed1bd"/><text x="60" y="2342" class="copy">Both flows roll up to the same project.</text><text x="60" y="2376" class="copy">Revenue, costs and records stay connected.</text>
</svg>
