<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2320" viewBox="0 0 720 2320" role="img" aria-labelledby="title desc">
  <title id="title">CRM deal-to-cash workflow, mobile layout</title>
  <desc id="desc">Eight connected steps across sales, sales administration, project delivery and finance: qualified lead, advancing funnel, accepted quote, approved sales order, project opened, delivery tracked, milestone due, and payment received. Management sees live pipeline, billing forecast, delivery progress and collections.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1 12 7 1 13" fill="none" stroke="#b83e12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:Archivo,Arial,sans-serif;fill:#20201e}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.title{font-size:38px;font-weight:750}.step{font-size:20px;font-weight:700;letter-spacing:1.4px;fill:#b83e12}.head{font-size:30px;font-weight:750}.copy{font-size:24px;fill:#494944}.lane{font-size:18px;font-weight:700;letter-spacing:1.4px;fill:#494944}.accent{font-size:23px;font-weight:700;fill:#b83e12}</style></defs>
  <rect width="720" height="2460" fill="#f6f3ec"/><text x="45" y="58" class="eyebrow">CRM · DEAL TO CASH</text><text x="45" y="111" class="title">One record, end to end</text><text x="45" y="151" class="copy">Sales, delivery and finance share the same journey.</text>
  <g fill="#eee9df" stroke="#a6a49d" stroke-width="2"><rect x="45" y="190" width="630" height="155" rx="4"/><rect x="45" y="380" width="630" height="155" rx="4"/><rect x="45" y="570" width="630" height="155" rx="4"/><rect x="45" y="760" width="630" height="155" rx="4"/><rect x="45" y="950" width="630" height="155" rx="4"/><rect x="45" y="1140" width="630" height="155" rx="4"/><rect x="45" y="1330" width="630" height="155" rx="4"/><rect x="45" y="1520" width="630" height="155" rx="4"/></g>
  <g fill="none" stroke="#b83e12" stroke-width="3" marker-end="url(#arrow)"><path d="M360 345v28"/><path d="M360 535v28"/><path d="M360 725v28"/><path d="M360 915v28"/><path d="M360 1105v28"/><path d="M360 1295v28"/><path d="M360 1485v28"/></g>
  <g><text x="72" y="224" class="lane">SALES · STEP 01</text><text x="72" y="264" class="head">Lead qualified</text><text x="72" y="303" class="copy">Becomes account, contact and opportunity.</text>
  <text x="72" y="414" class="lane">SALES · STEP 02</text><text x="72" y="454" class="head">Funnel advances</text><text x="72" y="493" class="copy">Stage-gated approvals keep decisions visible.</text>
  <text x="72" y="604" class="lane">SALES · STEP 03</text><text x="72" y="644" class="head">Quote accepted</text><text x="72" y="683" class="copy">Revisions stay preserved; taxes and currency fixed.</text>
  <text x="72" y="794" class="lane">SALES ADMIN · STEP 04</text><text x="72" y="834" class="head">Sales order</text><text x="72" y="873" class="copy">The numbered, approved pivot record.</text>
  <text x="72" y="984" class="lane">PROJECT · STEP 05</text><text x="72" y="1024" class="head">Project opens</text><text x="72" y="1063" class="copy">Item list and payment milestones carry forward.</text>
  <text x="72" y="1174" class="lane">PROJECT · STEP 06</text><text x="72" y="1214" class="head">Delivery tracked</text><text x="72" y="1253" class="copy">Progress updates for each milestone.</text>
  <text x="72" y="1364" class="lane">FINANCE · STEP 07</text><text x="72" y="1404" class="head">Milestone due</text><text x="72" y="1443" class="copy">Invoice instruction sent to Autocount.</text>
  <text x="72" y="1554" class="lane">FINANCE · STEP 08</text><text x="72" y="1594" class="head">Payment received</text><text x="72" y="1633" class="copy">Status returns to milestone and funnel.</text></g>
  <rect x="45" y="1740" width="630" height="410" rx="4" fill="#eed1bd"/><text x="75" y="1788" class="step">MANAGEMENT · LIVE VIEW</text><text x="75" y="1844" class="head">Everything above, visible live</text><text x="75" y="1902" class="copy">Pipeline · billing forecast · delivery progress</text><text x="75" y="1942" class="copy">Collections · fewer month-end surprises</text><path d="M75 1980h570" stroke="#b83e12" stroke-width="2"/><text x="75" y="2030" class="accent">One record travels the whole journey.</text><text x="75" y="2070" class="copy">No re-keying. No waiting for a folder.</text>
  <text x="45" y="2210" class="copy">The handoffs connect sales, delivery and finance</text><text x="45" y="2250" class="copy">so teams can see what happened and what comes next.</text>
</svg>
