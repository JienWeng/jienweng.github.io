<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Project-to-cash workflow</title>
  <desc id="desc">An approved sales order creates a project. Delivery phases lead to a milestone claim, manager approval, sales invoice, payment receipt, and updated project and funnel margin. Until Phase 2 is delivered, milestones are updated manually.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#b83e12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Archivo,Arial,sans-serif;fill:#20201e}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px}.head{font-size:27px;font-weight:750}.copy{font-size:20px;fill:#494944}.step{font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#b83e12}.note{font-size:19px;fill:#494944}
    </style>
  </defs>
  <rect width="1600" height="920" fill="#f6f3ec"/>
  <text x="64" y="64" class="eyebrow">CRM · PROJECT DELIVERY</text>
  <text x="64" y="111" class="head" style="font-size:36px">From approved sale to collected milestone</text>
  <text x="64" y="153" class="copy">The sales order binds one sale to one project; each approved milestone can be billed and tracked.</text>

  <g fill="#eee9df" stroke="#a6a49d" stroke-width="2">
    <rect x="64" y="218" width="330" height="150" rx="4"/><rect x="456" y="218" width="330" height="150" rx="4"/>
    <rect x="848" y="218" width="330" height="150" rx="4"/><rect x="1240" y="218" width="296" height="150" rx="4"/>
    <rect x="1240" y="526" width="296" height="150" rx="4"/><rect x="848" y="526" width="330" height="150" rx="4"/>
    <rect x="456" y="526" width="330" height="150" rx="4"/><rect x="64" y="526" width="330" height="150" rx="4"/>
  </g>
  <g fill="none" stroke="#b83e12" stroke-width="3" marker-end="url(#arrow)">
    <path d="M394 293h48"/><path d="M786 293h48"/><path d="M1178 293h48"/>
    <path d="M1388 368v140"/><path d="M1240 601h-48"/><path d="M848 601h-48"/><path d="M456 601h-48"/>
  </g>
  <g>
    <text x="88" y="254" class="step">01 · COMMERCIAL</text><text x="88" y="294" class="head">Sales order</text><text x="88" y="329" class="copy">Won deal, approved and numbered.</text>
    <text x="480" y="254" class="step">02 · SETUP</text><text x="480" y="294" class="head">Project</text><text x="480" y="329" class="copy">Bound 1:1 to the order, with</text><text x="480" y="354" class="copy">items, budget, team and phases.</text>
    <text x="872" y="254" class="step">03 · DELIVERY</text><text x="872" y="294" class="head">Project phases</text><text x="872" y="329" class="copy">Deliverables and progress tracked</text><text x="872" y="354" class="copy">for each phase.</text>
    <text x="1264" y="254" class="step">04 · BILLING REQUEST</text><text x="1264" y="294" class="head">Milestone claim</text><text x="1264" y="329" class="copy">Completed phase, with</text><text x="1264" y="354" class="copy">evidence attached.</text>
    <text x="1264" y="562" class="step">05 · CONTROL</text><text x="1264" y="602" class="head">Milestone approved</text><text x="1264" y="637" class="copy">Manager sign-off recorded.</text>
    <text x="872" y="562" class="step">06 · ACCOUNTS RECEIVABLE</text><text x="872" y="602" class="head">Sales invoice</text><text x="872" y="637" class="copy">Issued for the approved milestone.</text>
    <text x="480" y="562" class="step">07 · COLLECTION</text><text x="480" y="602" class="head">Payment receipt</text><text x="480" y="637" class="copy">Matched against the invoice.</text>
    <text x="88" y="562" class="step">08 · VISIBILITY</text><text x="88" y="602" class="head">Margin updated</text><text x="88" y="637" class="copy">Project and funnel records stay current.</text>
  </g>
  <rect x="340" y="742" width="920" height="106" rx="4" fill="#eed1bd"/>
  <text x="376" y="782" class="step">CURRENT LIMITATION</text>
  <text x="376" y="818" class="note">Until Phase 2 is delivered, milestones are updated manually.</text>
  <text x="64" y="885" class="copy">Target loop: phase complete → claim → approval → invoice → receipt → margin.</text>
</svg>
