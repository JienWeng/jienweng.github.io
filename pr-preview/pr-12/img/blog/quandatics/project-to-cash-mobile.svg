<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1830" viewBox="0 0 720 1830" role="img" aria-labelledby="title desc">
  <title id="title">Project-to-cash workflow, mobile layout</title>
  <desc id="desc">The sales order creates a project. Delivery phases lead to a milestone claim, approval, invoice, receipt, and updated project margin. Milestones are currently updated manually until Phase 2 is delivered.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1 12 7 1 13" fill="none" stroke="#b83e12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:Archivo,Arial,sans-serif;fill:#20201e}.eyebrow{font-size:23px;font-weight:700;letter-spacing:2px}.title{font-size:37px;font-weight:750}.step{font-size:20px;font-weight:700;letter-spacing:1.5px;fill:#b83e12}.head{font-size:31px;font-weight:750}.copy{font-size:25px;fill:#494944}.note{font-size:24px;fill:#494944}</style></defs>
  <rect width="720" height="1830" fill="#f6f3ec"/><text x="45" y="58" class="eyebrow">CRM · PROJECT DELIVERY</text><text x="45" y="111" class="title">From sale to collected milestone</text><text x="45" y="151" class="copy">One approved order opens and tracks the project.</text>
  <g fill="#eee9df" stroke="#a6a49d" stroke-width="2"><rect x="45" y="190" width="630" height="130" rx="4"/><rect x="45" y="365" width="630" height="130" rx="4"/><rect x="45" y="540" width="630" height="130" rx="4"/><rect x="45" y="715" width="630" height="130" rx="4"/><rect x="45" y="890" width="630" height="130" rx="4"/><rect x="45" y="1065" width="630" height="130" rx="4"/><rect x="45" y="1240" width="630" height="130" rx="4"/><rect x="45" y="1415" width="630" height="130" rx="4"/></g>
  <g fill="none" stroke="#b83e12" stroke-width="3" marker-end="url(#arrow)"><path d="M360 320v35"/><path d="M360 495v35"/><path d="M360 670v35"/><path d="M360 845v35"/><path d="M360 1020v35"/><path d="M360 1195v35"/><path d="M360 1370v35"/></g>
  <g><text x="72" y="226" class="step">01 · COMMERCIAL</text><text x="72" y="264" class="head">Approved sales order</text><text x="72" y="297" class="copy">Won deal, approved and numbered.</text>
  <text x="72" y="401" class="step">02 · PROJECT SETUP</text><text x="72" y="439" class="head">Project opened</text><text x="72" y="472" class="copy">Bound 1:1 to the order, items, budget and team.</text>
  <text x="72" y="576" class="step">03 · DELIVERY</text><text x="72" y="614" class="head">Project phases</text><text x="72" y="647" class="copy">Each phase has deliverables and progress.</text>
  <text x="72" y="751" class="step">04 · BILLING REQUEST</text><text x="72" y="789" class="head">Milestone claim</text><text x="72" y="822" class="copy">Submit completed phase with evidence.</text>
  <text x="72" y="926" class="step">05 · CONTROL</text><text x="72" y="964" class="head">Milestone approved</text><text x="72" y="997" class="copy">Manager sign-off is recorded.</text>
  <text x="72" y="1101" class="step">06 · ACCOUNTS RECEIVABLE</text><text x="72" y="1139" class="head">Sales invoice</text><text x="72" y="1172" class="copy">Issued for the approved milestone.</text>
  <text x="72" y="1276" class="step">07 · COLLECTION</text><text x="72" y="1314" class="head">Payment receipt</text><text x="72" y="1347" class="copy">Matched against the invoice.</text>
  <text x="72" y="1451" class="step">08 · VISIBILITY</text><text x="72" y="1489" class="head">Margin updated</text><text x="72" y="1522" class="copy">Project and funnel records stay current.</text></g>
  <rect x="45" y="1590" width="630" height="145" rx="4" fill="#eed1bd"/><text x="72" y="1633" class="step">CURRENT LIMITATION</text><text x="72" y="1674" class="note">Until Phase 2 is delivered, milestones</text><text x="72" y="1707" class="note">are updated manually.</text><text x="45" y="1785" class="copy">Target: phase → claim → approval → invoice → receipt.</text>
</svg>
