<svg xmlns="http://www.w3.org/2000/svg" width="1666" height="900" viewBox="0 0 1666 900" role="img" aria-labelledby="title desc">
  <title id="title">CryptoRails payment workflow</title>
  <desc id="desc">Five stages across merchant, customer, blockchain, CryptoRails, and merchant backend: create a payment request, review and sign it, wait for the transaction to be confirmed, match the on-chain details to the request, and settle through a signed webhook. Failed, delayed, expired, or mismatched payments go to recovery or review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#b83e12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .paper{fill:#f6f3ec}.lane{fill:#faf8f3;stroke:#b9b2a8;stroke-width:1.5}.lane-alt{fill:#f2eee6;stroke:#b9b2a8;stroke-width:1.5}.ink{fill:#242321}.muted{fill:#706b64}.rust{fill:#b83e12}.white{fill:#fffaf4}
      .card{fill:#fffdfa;stroke:#242321;stroke-width:2}.final{fill:#b83e12;stroke:#b83e12;stroke-width:2}.recovery{fill:#fffdfa;stroke:#b9b2a8;stroke-width:2;stroke-dasharray:8 7}
      .arrow{fill:none;stroke:#b83e12;stroke-width:3;marker-end:url(#arrow)}.branch{fill:none;stroke:#b9b2a8;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .title{font:700 34px Arial,sans-serif;letter-spacing:-.4px}.subtitle{font:18px Arial,sans-serif}.lane-label{font:700 16px Arial,sans-serif;letter-spacing:1px}.step{font:700 14px Arial,sans-serif;letter-spacing:1.2px}.card-title{font:700 21px Arial,sans-serif;letter-spacing:-.2px}.copy{font:18px Arial,sans-serif}.small{font:16px Arial,sans-serif}.note{font:italic 16px Arial,sans-serif}
    </style>
  </defs>

  <rect class="paper" width="1666" height="900"/>
  <text x="38" y="50" class="title ink">A payment is complete when the evidence matches</text>
  <text x="39" y="82" class="subtitle muted">The wallet starts the journey. Verified settlement ends it.</text>

  <rect x="26" y="108" width="1614" height="118" class="lane"/>
  <rect x="26" y="226" width="1614" height="118" class="lane-alt"/>
  <rect x="26" y="344" width="1614" height="118" class="lane"/>
  <rect x="26" y="462" width="1614" height="118" class="lane-alt"/>
  <rect x="26" y="580" width="1614" height="118" class="lane"/>
  <text x="46" y="174" class="lane-label ink">MERCHANT</text>
  <text x="46" y="292" class="lane-label ink">CUSTOMER</text>
  <text x="46" y="410" class="lane-label ink">BLOCKCHAIN</text>
  <text x="46" y="528" class="lane-label ink">CRYPTORAILS</text>
  <text x="46" y="646" class="lane-label ink">MERCHANT BACKEND</text>

  <path d="M515 167 C530 167 525 285 540 285" class="arrow"/>
  <path d="M785 285 C800 285 795 403 810 403" class="arrow"/>
  <path d="M1055 403 C1070 403 1065 521 1080 521" class="arrow"/>
  <path d="M1325 521 C1340 521 1335 639 1350 639" class="arrow"/>
  <text x="1063" y="476" class="step rust">CONFIRMED</text>

  <rect x="270" y="116" width="245" height="102" rx="5" class="card"/>
  <circle cx="270" cy="116" r="18" class="rust"/><text x="270" y="121" text-anchor="middle" class="step white">1</text>
  <text x="293" y="145" class="step rust">REQUEST</text>
  <text x="293" y="169" class="card-title ink">Create payment</text>
  <text x="293" y="190" class="copy muted">amount · token · network</text>
  <text x="293" y="209" class="copy muted">recipient · expiry · reference</text>

  <rect x="540" y="234" width="245" height="102" rx="5" class="card"/>
  <circle cx="540" cy="234" r="18" class="rust"/><text x="540" y="239" text-anchor="middle" class="step white">2</text>
  <text x="563" y="263" class="step rust">WALLET</text>
  <text x="563" y="287" class="card-title ink">Review and sign</text>
  <text x="563" y="308" class="copy muted">check the payment details</text>
  <text x="563" y="327" class="copy muted">approve in the wallet</text>

  <rect x="810" y="352" width="245" height="102" rx="5" class="card"/>
  <circle cx="810" cy="352" r="18" class="rust"/><text x="810" y="357" text-anchor="middle" class="step white">3</text>
  <text x="833" y="381" class="step rust">ON-CHAIN</text>
  <text x="833" y="405" class="card-title ink">Track transaction</text>
  <text x="833" y="426" class="copy muted">hash · pending · processing</text>
  <text x="833" y="445" class="copy muted">confirmed or failed</text>

  <rect x="1080" y="470" width="245" height="102" rx="5" class="card"/>
  <circle cx="1080" cy="470" r="18" class="rust"/><text x="1080" y="475" text-anchor="middle" class="step white">4</text>
  <text x="1103" y="499" class="step rust">RECONCILE</text>
  <text x="1103" y="523" class="card-title ink">Verify the match</text>
  <text x="1103" y="544" class="copy muted">reference · amount · token</text>
  <text x="1103" y="563" class="copy muted">recipient · network · hash</text>

  <rect x="1350" y="588" width="245" height="102" rx="5" class="final"/>
  <circle cx="1350" cy="588" r="18" class="rust" stroke="#fffaf4" stroke-width="2"/><text x="1350" y="593" text-anchor="middle" class="step white">5</text>
  <text x="1373" y="617" class="step white">SETTLE</text>
  <text x="1373" y="641" class="card-title white">Notify merchant</text>
  <text x="1373" y="662" class="copy white">signed HMAC webhook</text>
  <text x="1373" y="681" class="copy white">updates its order</text>

  <path d="M932 447 V475 H946 V741" class="branch"/>
  <rect x="270" y="741" width="1325" height="88" rx="5" class="recovery"/>
  <text x="296" y="774" class="step rust">RECOVER OR REVIEW</text>
  <text x="296" y="800" class="card-title ink">Failed, delayed, expired, or mismatched payment</text>
  <text x="296" y="820" class="small muted">Retry or review; never settle from the browser signal alone.</text>
  <text x="1635" y="870" text-anchor="end" class="note muted">Network rules vary: EVM gas · TRON Energy rental + Bandwidth.</text>
</svg>
