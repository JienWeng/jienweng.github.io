name: Pull request preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      preview_ref:
        description: Branch or commit to build for a one-off preview
        required: true
        type: string
      preview_pr_number:
        description: Pull request number used in the preview URL
        required: true
        type: number

permissions:
  contents: write
  deployments: read
  pages: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_ref || github.event.pull_request.head.sha }}

      - name: Install Zola
        if: github.event.action != 'closed'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Install Node for interaction checks
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check playback and visitor events
        if: github.event.action != 'closed'
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-interaction-check" --no-package-lock jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/portfolio-interaction-check/node_modules" node scripts/check_site_interactions.cjs

      - name: Install public profile dependencies
        if: github.event.action != 'closed'
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-profile.txt

      - name: Build preview site
        if: github.event.action != 'closed'
        run: |
          python3 scripts/generate_llms.py
          python3 scripts/generate_cv_pdf.py
          python3 scripts/check_public_profile.py
          zola build --base-url "https://jienweng.github.io/pr-preview/pr-${{ inputs.preview_pr_number || github.event.pull_request.number }}/"
          touch public/.nojekyll

      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ inputs.preview_pr_number || github.event.pull_request.number }}
          pages-base-url: jienweng.github.io
          action: ${{ github.event_name == 'workflow_dispatch' && 'deploy' || 'auto' }}
          wait-for-pages-deployment: true
          qr-code: false
