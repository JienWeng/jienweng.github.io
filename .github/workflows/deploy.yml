name: Deploy Zola site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Install Node for interaction checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check playback and visitor events
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-interaction-check" --no-package-lock jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/portfolio-interaction-check/node_modules" node scripts/check_site_interactions.cjs

      - name: Install public profile dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-profile.txt

      - name: Build site
        run: |
          python3 scripts/generate_llms.py
          python3 scripts/generate_cv_pdf.py
          python3 scripts/check_public_profile.py
          zola build
          touch public/.nojekyll

      - name: Check SEO metadata and local links
        run: python3 scripts/check_site_seo.py public

      - name: Publish site while preserving pull request previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean-exclude: pr-preview
          force: false
