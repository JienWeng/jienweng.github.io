content = """
Added type annotations to `sympy.utilities.exceptions`, covering `SymPyDeprecationWarning`, `sympy_deprecation_warning`, and `ignore_warnings`. The patch uses a `TYPE_CHECKING` guard to keep `collections.abc` out of the runtime import path. Reviewed and merged into `sympy:master` by maintainer [@oscarbenjamin](https://github.com/oscarbenjamin). Part of the broader typing effort tracked in [Issue #28806](https://github.com/sympy/sympy/issues/28806).
"""
