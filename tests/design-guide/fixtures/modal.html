<!doctype html><html lang="en"><meta charset="utf-8"><title>Project settings</title>
<style>body{font:18px system-ui;margin:0}.backdrop{position:fixed;inset:0;background:#0008;overflow:auto}.modal{box-sizing:border-box;width:640px;background:#fff;padding:32px;margin:80px auto}button{font:inherit;padding:12px}</style>
<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description"><h1 id="modal-title">Delete project?</h1><p id="modal-description">This permanently deletes the project and its files.</p><button id="delete">Delete project</button></section></div>
<script>document.querySelector('#delete').addEventListener('click',()=>{window.simulatedDelete=true})</script></html>
